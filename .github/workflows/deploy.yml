name: Deploy — Railway

on:
    workflow_run:
        workflows: ["CI — Lint, Test, Build"]
        types: [completed]
        branches: [main]
    workflow_dispatch:

jobs:
    deploy-backend:
        name: Deploy Backend to Railway
        runs-on: ubuntu-latest
        if: >
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main')

        steps:
            - uses: actions/checkout@v4

            - name: Install Railway CLI
              run: npm install -g @railway/cli@3

            - name: Deploy API service
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway up --detach --service scorelock-api

            - name: Deploy Celery worker
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway up --detach --service scorelock-worker

            - name: Deploy Celery beat
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway up --detach --service scorelock-beat

            - name: Smoke test
              run: |
                  sleep 45
                  chmod +x infra/smoke-test.sh
                  ./infra/smoke-test.sh https://scorelock.saidborna.com || echo "::warning::Some smoke tests failed"

            - name: Create Sentry release
              if: env.SENTRY_AUTH_TOKEN != ''
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
              run: |
                  curl -sL https://sentry.io/get-cli/ | bash
                  sentry-cli releases new scorelock-api@${{ github.sha }}
                  sentry-cli releases set-commits scorelock-api@${{ github.sha }} --auto
                  sentry-cli releases finalize scorelock-api@${{ github.sha }}

    deploy-frontend:
        name: Deploy Frontend
        runs-on: ubuntu-latest
        needs: deploy-backend
        if: >
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main')

        steps:
            - uses: actions/checkout@v4

            # Vercel auto-deploys on push to main if connected.
            # This step is a fallback for manual deploy via CLI.
            - name: Deploy to Vercel (if configured)
              if: env.VERCEL_TOKEN != ''
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              working-directory: frontend
              run: |
                  npm install -g vercel@latest
                  vercel pull --yes --environment=production --token=$VERCEL_TOKEN
                  vercel build --prod --token=$VERCEL_TOKEN
                  vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
