name: Deploy — Railway

on:
    workflow_run:
        workflows: ["CI — Lint, Test, Build"]
        types: [completed]
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy to Railway
        runs-on: ubuntu-latest
        if: >
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.head_branch == 'main')

        steps:
            - uses: actions/checkout@v4

            - name: Install Railway CLI
              run: npm install -g @railway/cli@latest

            - name: Deploy API service
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway up --detach --service scorelock-api

            - name: Deploy Celery worker
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway up --detach --service scorelock-worker

            - name: Deploy Celery beat
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway up --detach --service scorelock-beat

            - name: Deploy Frontend
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              run: railway up --detach --service scorelock-frontend

            - name: Smoke test
              run: |
                  sleep 45
                  chmod +x infra/smoke-test.sh
                  ./infra/smoke-test.sh https://scorelock.saidborna.com || echo "::warning::Some smoke tests failed"

            - name: Create Sentry release
              if: env.SENTRY_AUTH_TOKEN != ''
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
              run: |
                  curl -sL https://sentry.io/get-cli/ | bash
                  sentry-cli releases new scorelock@${{ github.sha }}
                  sentry-cli releases set-commits scorelock@${{ github.sha }} --auto
                  sentry-cli releases finalize scorelock@${{ github.sha }}
