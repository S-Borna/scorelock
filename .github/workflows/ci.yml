name: CI — Lint, Test, Build

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

env:
    PYTHON_VERSION: "3.12"
    NODE_VERSION: "20"

jobs:
    # ── Backend Tests ──────────────────────────────────────
    backend-test:
        name: Backend — Lint & Test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: scorelock_test
                    POSTGRES_PASSWORD: scorelock_test
                    POSTGRES_DB: scorelock_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U scorelock_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql+asyncpg://scorelock_test:scorelock_test@localhost:5432/scorelock_test
            REDIS_URL: redis://localhost:6379/0
            CELERY_BROKER_URL: redis://localhost:6379/1
            CELERY_RESULT_BACKEND: redis://localhost:6379/2
            SECRET_KEY: test-secret-key-ci
            ENVIRONMENT: test
            API_FOOTBALL_KEY: ""
            ANTHROPIC_API_KEY: ""

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
                  cache: pip
                  cache-dependency-path: backend/requirements.txt

            - name: Install dependencies
              working-directory: backend
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install ruff pytest "pytest-asyncio>=0.24,<2" httpx

            - name: Lint with Ruff
              working-directory: backend
              run: ruff check .

            - name: Check formatting
              working-directory: backend
              run: ruff format --check .

            - name: Run tests
              working-directory: backend
              run: python -m pytest tests/ -v --tb=short

    # ── Backend Docker Build ─────────────────────────────────
    backend-build:
        name: Backend — Docker Build
        runs-on: ubuntu-latest
        needs: backend-test

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build backend image
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  push: false
                  tags: scorelock-backend:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # ── Frontend Tests ───────────────────────────────────────
    frontend-test:
        name: Frontend — Lint & Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js ${{ env.NODE_VERSION }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: Lint
              working-directory: frontend
              run: npm run lint

            - name: Type check
              working-directory: frontend
              run: npm run type-check

            - name: Build
              working-directory: frontend
              run: npm run build
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:8000

    # ── Security Scan ────────────────────────────────────────
    security:
        name: Security — Dependency Audit
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install pip-audit
              run: pip install pip-audit

            - name: Audit Python dependencies
              working-directory: backend
              run: pip-audit -r requirements.txt --strict
              continue-on-error: true
